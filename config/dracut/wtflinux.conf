# /etc/dracut.conf.d/wtflinux.conf — Configuración dracut para WtfLinux
# Usado por la variante xbps (Void).

# Módulos adicionales para ISO live
add_dracutmodules+=" dmsquash-live qemu net livenet "

# Módulos base
dracutmodules+=" kernel-modules resume rootfs-block base fs-lib shutdown "
dracutmodules+=" systemd systemd-initrd "

# Compresión
compress="zstd"
compress_options="-19 -T0"

# Sin hostonly: la initramfs debe ser genérica porque va en una ISO
hostonly="no"
hostonly_cmdline="no"

# Añadir binarios útiles
install_items+=" /bin/setsid /usr/bin/setsid /bin/cat /bin/ls /usr/bin/less "
install_items+=" /usr/sbin/squashfs /usr/bin/unsquashfs "

# Firmwares
firmware_dirs+=" /usr/lib/firmware "

# Tamaño máximo del initramfs (KB)
stdinchunksize="1024"
