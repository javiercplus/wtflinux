# /etc/mkinitcpio.conf — WtfLinux live config (variante pacman / Arch)
# Hooks necesarios para que la ISO arranque desde squashfs.

MODULES=()
BINARIES=()
FILES=()

# Hooks: base + udev + modconf + block (storage) + filesystems
# + keyboard keymap (latam/us) + fsck (verificar particiones)
# + squashfs (para leer el rootfs.squashfs)
HOOKS=(base udev modconf block filesystems keyboard keymap fsck squashfs)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
