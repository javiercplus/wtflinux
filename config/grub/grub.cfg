# grub.cfg — Plantilla para WtfLinux ISO (no es la final; la genera 06-config-grub.sh)
# Se incluye aquí como referencia / fallback si el script no puede generarlo.

set default=0
set timeout=10
set pager=1

insmod all_video
insmod gfxterm
insmod gettext
insmod part_msdos
insmod part_gpt
insmod fat
insmod ext2
insmod iso9660
insmod loopback
insmod squash4

set gfxmode=auto
set gfxpayload=keep
terminal_input console
terminal_output gfxterm

menuentry "WtfLinux (live)" {
    set gfxpayload=keep
    linux /boot/vmlinuz \
        root=live:CDLABEL=WTFLINUX \
        ro \
        rd.live.image \
        rd.live.overlay.overlayfs=1 \
        rd.live.squashfs=/lib/wtflinux/rootfs.squashfs \
        rd.shell rd.emergency=reboot \
        loglevel=3 \
        vt.global_cursor_default=0 \
        i915.modeset=1 nouveau.modeset=1 radeon.modeset=1 amdgpu.modeset=1
    initrd /boot/initramfs.img
}

menuentry "WtfLinux (live, nomodeset)" {
    set gfxpayload=text
    linux /boot/vmlinuz \
        root=live:CDLABEL=WTFLINUX \
        ro \
        rd.live.image \
        rd.live.overlay.overlayfs=1 \
        rd.live.squashfs=/lib/wtflinux/rootfs.squashfs \
        rd.shell rd.emergency=reboot \
        loglevel=3 \
        nomodeset \
        3
    initrd /boot/initramfs.img
}

menuentry "WtfLinux — rescue shell" {
    set gfxpayload=text
    linux /boot/vmlinuz \
        root=live:CDLABEL=WTFLINUX \
        ro \
        rd.shell \
        loglevel=7
    initrd /boot/initramfs.img
}

menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
