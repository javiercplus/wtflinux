# /etc/lightdm/lightdm.conf — WtfLinux live config
#
# Pantalla de login: lightdm-gtk-greeter, autologin del usuario `anon`.

[LightDM]
run-directory=/run/lightdm
# Autologin al usuario live (sobreescribe el skel del usuario)
autologin-user=anon
autologin-user-timeout=0
user-session=i3
greeter-session=lightdm-gtk-greeter

[Seat:*]
xserver-command=X :0 -nolisten tcp vt7 -keeptty
xserver-allow-tcp=false
pam-service=lightdm
pam-autologin-service=lightdm-autologin

[LightDM]
logind-check-graphical=true

[XDMCPServer]
enabled=false

[VNCServer]
enabled=false
