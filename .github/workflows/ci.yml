# Dependencias para development local
# Útil si quieres correr los scripts fuera de GHA.

name: wtflinux-dev

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck sobre scripts/lfs
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: scripts
          format: gcc

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: {max: 200}, document-start: {present: false}, truthy: {check-keys: false}}}" \
            .github/workflows/ || true
